styles: ".nav-link {\r\n  white-space: nowrap;\r\n}\r\n.team-style-2 .item img {\r\n    object-position: top;\r\n}\r\n.home-banner-3 .item-content>span {\r\n   padding-inline: 5px;\r\n}\r\n.header {\r\n    z-index: 12;\r\n}\r\n.team-style-2 .item img {\r\n    width: 100%;\r\n    object-position: top;\r\n    height: 400px;\r\n    object-fit: cover;\r\n}\r\n.header .navigation-sticky.fixed-top {\r\n    background-color: black;\r\n}\r\n.login .brand-name, .register .brand-name, .forgot-password .brand-name{\r\n    background-color: black;\r\n}\r\n    #header-3 .header-content {\r\n        background-color: transparent;\r\n    }\r\n\r\n.footer p {\r\n    opacity: 1  !important;\r\n}\r\n.footer ul a {\r\n    opacity: 90%  !important;\r\n}\r\n\r\n.footer a i {\r\n    opacity: 90% !important;\r\n}\r\n.footer ul a:hover, .footer .social-icon a:hover i {\r\n    opacity: 1 !important;\r\n}\r\n.header .hamburger-btn {\r\n    display:none !important\r\n}\r\n.home-banner-3 .banner-bg svg {\r\n    left: 0;\r\n    transform: scale(1.3);\r\n}\r\n.owl-carousel .owl-item img {\r\n    padding: 20px;\r\n    width: auto;\r\n    height: 87px;\r\n}\r\n@media (max-width: 1079px) {\r\n.header .navbar-wrapper.navigation-sticky{\r\n    background-color: black;\r\n}\r\n.home-banner-3 .banner-bg svg {\r\n    display:none\r\n}\r\n}\r\n@media (min-width: 1080px) and (max-width: 1420px) {\r\n    .carousel-inner {\r\n        width: 100%;\r\n        margin: 0 auto;\r\n    }\r\n}\r\n.portfolio-full-width.portfolio-sidebar .image img {\r\n    height: 480px;\r\n    margin-bottom: 50px;\r\n    object-fit: cover;\r\n    object-position: top;\r\n}\r\n.portfolio-about{\r\ndisplay: unset !important;\r\n}\r\n\r\n.portfolio-full-width i {\r\n    font-size: 20px;\r\n}\r\nul.social-icon {\r\n    display: flex;\r\n    gap: 20px;\r\n}\r\n\r\nli { white-space: nowrap;}\r\n.portfolio-full-width.portfolio-sidebar .image img {\r\nobject-fit: contain !important;}\r\n\r\n\r\n\r\n\r\n/* General Grid Styles */\r\n\r\n\r\n/* Section and Element Layouts */\r\n.userinfo-section,\r\n.profile,\r\n.project {\r\n  display: grid;\r\n  align-items: center;\r\n  grid-template-columns: repeat(4,1fr);\r\n}\r\n\r\n@media (min-width: 1280px) {\r\n  .userinfo-section__left,\r\n  .userinfo-section__right,\r\n  .profile__image-container,\r\n  .profile__content,\r\n  .project__left,\r\n  .project__right {\r\n    grid-column: span 6 !important;\r\n  }\r\n  .userinfo-section__right{\r\n      grid-row: unset !important;\r\n  }\r\n}\r\n\r\n.userinfo-section__left,\r\n.userinfo-section__right,\r\n.profile__image-container,\r\n.profile__content,\r\n.project__left,\r\n.project__right {\r\n  grid-column: span 4;\r\n}\r\n\r\n/* Project Specific Styles */\r\n.project__right {\r\n  display: flex;\r\n  justify-content: center;\r\n  justify-items: center;\r\n  flex-direction: column;\r\n}\r\n\r\n.project__name-text {\r\n  font-size: 2rem;\r\n}\r\n.project__date-text,\r\n.project__category {\r\n  font-size: 1rem;\r\n}\r\n.project__image  img {\r\n  width: 100%;\r\n  height: auto;\r\n  border-radius: 24px;\r\n}\r\n.project {\r\n  padding-bottom: 50px;\r\n}\r\n.project__name  {\r\n  font-size: 40px;\r\n  text-transform: capitalize;\r\n  font-weight: 500;\r\n}\r\n.project__category  {\r\n  font-weight: 500;\r\n}\r\n\r\n/* Profile Specific Styles */\r\n.profile {\r\n  position: relative;\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n}\r\n\r\n.profile__image-container img {\r\n         width: 100%;\r\n        height: 100%;\r\n        object-fit: cover;\r\n            border-radius: 50%;\r\n}\r\n@media (min-width: 768px) {\r\n  .profile__image-container img {\r\n    width: 100%;\r\n    height: 100%;\r\n    object-fit: cover;\r\n  }\r\n}\r\n@media (min-width: 1280px) {\r\n  .profile__image-container img {\r\n         width: 100%;\r\n        height: 100%;\r\n        object-fit: cover;\r\n  }\r\n}\r\n\r\n.profile__header {\r\n  font-size: 3.125rem; /* 50px */\r\n  text-align: center;\r\n}\r\n@media (min-width: 768px) {\r\n  .profile__header {\r\n    font-size: 4.375rem; /* 70px */\r\n    margin-top: -5vh;\r\n  }\r\n}\r\n\r\n.profile__body-text {\r\n  text-align: center;\r\n  margin-top: 5vh;\r\n}\r\n\r\n\r\n/* Miscellaneous Styles */\r\n.userinfo-section__right--image .field--name-field-photo{\r\n  height: 350px;\r\n    \r\n}\r\n.userinfo-section__right--image img {\r\n    width: 100%;\r\n    height: 100%;\r\n    object-fit: cover;\r\n    overflow: hidden;\r\n    object-position: top;\r\n}\r\n.file--x-office-document {\r\n  display: flex;\r\n  justify-content: center;\r\n  padding: 10px;\r\n  background: gainsboro;\r\n}\r\n.userinfo-section__left--title h2 {\r\n  margin-top: 2em;\r\n  color: black;\r\n}\r\n@media (min-width: 1280px) {\r\n    .userinfo-section__right--image {\r\n        height: 350px;\r\n    }\r\n  .userinfo-section__left--title {\r\n    margin-top: 0;\r\n  }\r\n \r\n.projects-section{\r\n    margin-top: 2em;\r\n}\r\n}\r\n.userinfo-section__left--name {\r\n    margin-top: 0;\r\n    font-size: 2em;\r\n    font-weight: 500;\r\n}\r\n\r\n.js-pager__items.pager .pager__item .button.btn.btn-primary.btn-style-1-lg {\r\n  margin-bottom: 20px;\r\n  margin-top: -87px;\r\n}\r\n.starrating {\r\n  display: flex;\r\n  gap: 4px;\r\n}\r\n.star1-on {\r\n  background: url(/themes/custom/drupify/assets/icons/on-icon.png) no-repeat !important;\r\n  background-size: contain !important;\r\n}\r\n.star-off {\r\n  background: url(/themes/custom/drupify/assets/icons/off-icon.png) no-repeat !important;\r\n  background-size: contain !important;\r\n}\r\n\r\n\r\n\r\n\r\n.skill {\r\n  display: flex;\r\n  /* justify-content: space-between; */\r\n  align-items: center;\r\n  align-content: center;\r\n  flex-wrap: wrap;\r\n}\r\n.skill-parent {\r\n  display: flex;\r\n  gap: 20px;\r\n  flex: 0 0 50%;\r\n}\r\n.skill__name {\r\n    width: 150px;\r\n}\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n.grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(4, 1fr);\r\n  column-gap: 20px;\r\n}\r\n@media (min-width: 768px) {\r\n  .grid {\r\n    grid-template-columns: repeat(8, 1fr);\r\n  }\r\n}\r\n@media (min-width: 1280px) {\r\n  .grid {\r\n    grid-template-columns: repeat(12, 1fr);\r\n  }\r\n}\r\n\r\n.portfolio-full-width .image img {\r\n    object-fit: contain;\r\n    \r\n}\r\n.profile__image-container .field--name-field-photo {\r\n    width: 300px;\r\n    height: 300px;\r\n    margin: auto;\r\n\r\n}\r\n@media (min-width: 768px) {\r\n .profile__image-container .field--name-field-photo {\r\n    width: 400px;\r\n    height: 400px;\r\n\r\n}\r\n}\r\n@media (min-width: 1280px) {\r\n.profile__image-container .field--name-field-photo {\r\n    width: 400px;\r\n    height: 400px;\r\n\r\n}\r\n}\r\n\r\n.m-b-4 {\r\n   margin-bottom: 4px !important;\r\n}\r\n.userinfo-section__left--name h2 span {\r\n    color: transparent;\r\n    -webkit-text-stroke: 2px #000;\r\n}\r\n.title-color {\r\n   color: var(--primary-color);\r\n    font-weight: 700;\r\n    font-style: normal;\r\n}\r\n.block-page-title-block .title {\r\n  color: white;\r\n}\r\n.breadcrumb a {\r\n  color: white;\r\n}\r\n.breadcrumb{\r\n  margin-left: 40px;\r\n}\r\n\r\na.document-file {\r\n    background: #04ab97;\r\n    padding: 16px 30px;\r\n    border-radius: 30px;\r\n    color: white;\r\n    margin-top: 10px;\r\n    display: inline-block;\r\n}\r\n\r\na.document-file::after {\r\n  content: \"\";\r\n  display: inline-block; /* Use inline-block for inline elements */\r\n  width: 100px;\r\n  height: 100px;\r\n  background-image: url('../assets/icons/download-icon.jpg');\r\n  background-size: cover;\r\n  background-repeat: no-repeat;\r\n  background-position: center;\r\n}\r\n.ajax-progress.ajax-progress-fullscreen{\r\n  background: #ffffff;\r\n  opacity: .9;\r\n  width: 100%;\r\n  height: 100%;\r\n  top: 0;\r\n  left: 0;\r\n  border-radius: 0;\r\n\r\n  .ajax-throbber{\r\n    background-color: var(--primary-color);\r\n    top: 50%;\r\n    left: 50%;\r\n    margin-left: -20px;\r\n    margin-top: -20px;\r\n  }\r\n}\r\n@media (min-width: 1280px) {\r\n.views-row:nth-of-type(2n) .project__left {\r\n  order: 2; \r\n}\r\n.views-row:nth-of-type(2n) .project__right {\r\n text-align: right;\r\n}\r\n}\r\n\r\n.userinfo-section__left--title .title-color .field__item {\r\n    margin-top: 15px;\r\n}\r\n@media only screen and (max-width: 767px) {\r\n    .userinfo-section__right {\r\n        grid-row: 1;\r\n    }\r\n}\r\n\r\n\r\n\r\n/* Container item */\r\n.item {\r\n    position: relative;\r\n.item-content {\r\nz-index: 4;}\r\n    \r\n}\r\n\r\n/* The overlay */\r\n.overlay {\r\n    position: absolute;\r\n    top: 0;\r\n    left: 0;\r\n    width: 100%;\r\n    height: 100%;\r\n    background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black */\r\n    display: flex;\r\n    justify-content: center;\r\n    align-items: center;\r\n    opacity: 0; /* Hidden by default */\r\n    transition: opacity 0.3s ease; /* Smooth transition */\r\n    z-index: 1; /* Ensure it is above the content */\r\n}\r\n\r\n/* Text inside the overlay */\r\n.overlay-text {\r\n    color: white;\r\n    font-size: 24px;\r\n    font-weight: bold;\r\n    text-align: center;\r\n}\r\n\r\n/* Show the overlay on hover */\r\n.item:hover .overlay {\r\n    opacity: 1; /* Show overlay when the item is hovered */\r\n}\r\n\r\n"
